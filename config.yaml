# ============================================================
# FundedNext EURUSD Trading Bot - Configuration
# ============================================================
# mode: "dry_run" (Mac testing) | "backtest" | "live" (Windows + MT5)
# ============================================================

mode: "live"

# --- MT5 Connection (live mode only, Windows + MT5) ---
# Secrets: set env vars MT5_PASSWORD, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# or edit this file locally on your Windows machine (do NOT push secrets to git)
mt5:
  path: "C:/Program Files/MetaTrader 5/terminal64.exe"
  login: 103778008
  password: ""          # Set via env var MT5_PASSWORD or edit locally
  server: "MetaQuotes-Demo"
  timeout: 10000

# --- Symbol & Timeframe ---
symbol: "EURUSD"
timeframe_entry: "H1"
timeframe_trend: "H4"
check_interval_seconds: 60

# --- Multi-Strategy: Breakout + Pullback + Mean Reversion ---
strategy:
  # Indicator periods
  ema_fast: 21        # H1 fast EMA (pullback zone)
  ema_slow: 50        # H1 slow EMA (trend filter)
  ema_trend: 100      # H1 trend EMA (direction)
  rsi_period: 14
  atr_period: 14
  adx_period: 14
  bb_period: 20       # Bollinger Band period
  bb_std: 2.0         # Bollinger Band std deviations
  # --- Breakout strategy params (PROVEN: PF 1.21 original) ---
  adx_threshold: 25   # Original proven value
  rr_ratio: 1.3       # Proven profitable R:R
  rsi_buy_low: 25.0
  rsi_buy_high: 65.0
  rsi_sell_low: 35.0
  rsi_sell_high: 75.0
  pullback_bars: 5
  ema_tolerance_pct: 0.006
  h4_slope_bars: 5
  breakout_bars: 20
  breakout_atr_sl: 1.2
  rsi_breakout_max: 75
  rsi_breakout_min: 25
  min_sl_pips: 15
  di_separation: 0
  # --- London Breakout (PRIMARY) ---
  london_breakout: true
  asian_start_hour: 0
  asian_end_hour: 6
  london_entry_start: 7
  london_entry_end: 11
  min_asian_range_pips: 15
  max_asian_range_pips: 45
  range_buffer_atr: 0.1
  london_trend_filter: true     # Original: keep EMA200 trend filter for quality
  london_retest: false
  retest_lookback: 3
  # --- SMC Filters ---
  smc_fvg_filter: true
  smc_fvg_lookback: 12
  smc_liq_sweep_bonus: true
  smc_liq_lookback: 8
  smc_ob_sl: true
  smc_require_confluence: true  # Original: require SMC for quality
  # --- Dual Session: NY Breakout ---
  dual_session: false           # DISABLED: NY breakout is net negative (-$66/trade)
  ny_range_start: 7
  ny_range_end: 12
  ny_entry_start: 13
  ny_entry_end: 16
  # --- Trend Pullback ---
  momentum_fallback: false      # Test: disable for isolation
  # --- Mean Reversion ---
  mean_reversion: false         # Disabled: dilutes edge (PF ~0.9 in testing)
  mr_adx_max: 20
  mr_rr_ratio: 1.0
  mr_bb_touch_pct: 0.95
  mr_min_sl_pips: 10
  mr_max_sl_pips: 30
  mr_hours_start: 0
  mr_hours_end: 7
  mr_hours2_start: 17
  mr_hours2_end: 22
  # --- Multi-position ---
  max_concurrent_positions: 1   # Test: single position for isolation

# --- Risk Management ---
risk:
  risk_percent: 1.5             # Original proven value
  risk_reduced: 0.75            # Original reduced risk
  max_spread_pips: 2.5
  max_slippage_pips: 3.0
  pip_value_per_lot: 10.0      # EURUSD standard: $10/pip/lot

# --- FundedNext Compliance ---
compliance:
  initial_balance: 100000.0
  max_daily_loss_pct: 3.5      # Internal limit (prop = 5%)
  max_total_dd_pct: 8.0        # Internal limit (prop = 10%)
  trailing_dd_enabled: true
  trailing_dd_pct: 8.0
  dd_tier1_pct: 5.0
  dd_tier2_pct: 7.0
  dd_tier2_factor: 0.5
  max_consec_losses: 5
  max_trades_per_day: 5        # Increased for multi-strategy
  reduce_risk_after: 3

# --- Trade Management ---
# All disabled: the multi-strategy approach provides edge through
# diversification, not trade management. BE with R:R=1.3 destroys wins.
trade_management:
  breakeven_enabled: false
  breakeven_r: 1.0
  trailing_enabled: false
  trailing_start_r: 1.5
  trailing_atr_mult: 1.5
  partial_close_enabled: false
  partial_close_r: 1.0
  partial_close_pct: 50.0

# --- Session Filter ---
session:
  enabled: false               # Strategies have built-in hour filters
  start_hour_utc: 7
  end_hour_utc: 17

# --- News Filter ---
news:
  enabled: true
  pre_minutes: 8
  post_minutes: 8
  cancel_pendings: true
  move_to_breakeven: true
  calendar_url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
  cache_ttl_seconds: 14400
  fail_safe: true

# --- Telegram Alerts ---
telegram:
  enabled: true
  bot_token: "YOUR_BOT_TOKEN_HERE"
  chat_id: "YOUR_CHAT_ID_HERE"

# --- Logging ---
logging:
  log_dir: "logs"
  trade_csv: true
  system_log: true
  verbose: false

# --- Backtest Settings ---
backtest:
  start_date: "2020-01-01"
  end_date: "2026-12-31"
  initial_balance: 100000.0
  spread_pips: 1.0
  slippage_pips: 0.5
